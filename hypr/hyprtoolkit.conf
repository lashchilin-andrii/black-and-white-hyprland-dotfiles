# ~/.config/hypr/hyprtoolkit.conf
# Hyprtoolkit general configuration

background = 0xCC000000
base = 0x00FFFFFF  		# The one behind "Search"
alternate_base = 0x00000000     # The one around "Search"
text = 0xFFFFFFFF
bright_text = 0xFFFFFFFF
accent = 0x36FFFFFF             # Main border color 
accent_secondary = 0xFFFFFFFF

# Font Sizes (int)
h1_size = 19
h2_size = 15
h3_size = 13
font_size = 17 # Apps list and the word in the input
small_font_size = 15

# Fonts & Icons (string)
font_family = Noto Sans Bold
font_family_monospace = monospace
icon_theme = none

# Rounding / Corner Radius (logical px)
rounding_large = 8
rounding_small = 4
